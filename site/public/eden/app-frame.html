<!--
  The code canvas's live UI preview for React (canvas-app.js frames it; canvas-model.js says what's
  React). Served with its own policy (APP_CSP): an opaque-origin sandbox with no cookies, no storage
  and no way into Eden's page. Its only network is esm.sh (React and the packages the code imports)
  and cdn.jsdelivr.net (Tailwind, when the code uses its classes). The page compiles nothing: it gets
  ready-to-run module code by postMessage, once per load (each draw is a fresh frame), and reports
  the console and errors back.
-->
<script type="importmap">{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react/": "https://esm.sh/react@18.3.1/",

<style>
:where(html){background:#fff;color:#16181d;color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:where(html.dark){background:#111317;color:#e9eaee;color-scheme:dark}
:where(body){margin:0}
#eden-error{margin:16px;padding:12px 14px;border-radius:10px;background:#fdecec;color:#a4161a;font:12px/1.5 ui-monospace,"SF Mono",Menlo,monospace;white-space:pre-wrap;word-break:break-word}
html.dark #eden-error{background:#3a1416;color:#ffb4b4}
</style>

<body><div id="root"></div>
<script type="module">
const TAILWIND = 'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4';
const parentWin = window.parent;
const send = (m) => parentWin.postMessage({ ...m, edenPreview: 1 }, '*'); // the parent checks event.source; nothing secret is sent

const fmt = (a) => {
  if (typeof a === 'string') return a;
  if (a instanceof Error) return a.stack && a.stack.includes(a.message) ? a.stack : `${a.name}: ${a.message}${a.stack ? `\n${a.stack}` : ''}`;
  try { return JSON.stringify(a, null, 2) ?? String(a); } catch { return String(a); }
};
// the console goes to the canvas too, up to 500 lines (a logging loop mustn't flood Eden's page)
let lines = 0;
for (const level of ['log', 'info', 'warn', 'error', 'debug']) {
  const orig = console[level].bind(console);
  console[level] = (...a) => {
    orig(...a);
    if (++lines === 501) send({ type: 'log', level: 'warn', text: 'More console output was left out.' });
    if (lines <= 500) send({ type: 'log', level, text: a.map(fmt).join(' ').slice(0, 8000) });
  };
}
addEventListener('error', (e) => send({ type: 'error', text: e.error ? fmt(e.error) : String(e.message || 'Error') }));
addEventListener('unhandledrejection', (e) => send({ type: 'error', text: `Unhandled promise rejection: ${fmt(e.reason)}` }));
addEventListener('securitypolicyviolation', (e) => send({ type: 'error', text: `The preview’s sandbox blocked ${e.blockedURI || 'something'} (${e.effectiveDirective}): previews reach only esm.sh (packages) and cdn.jsdelivr.net, so other data must be in the code.` }));

function theme(t) {
  document.documentElement.classList.toggle('dark', t === 'dark');
}
function showError(err) {
  const pre = document.createElement('pre');
  pre.id = 'eden-error';
  pre.textContent = err && err.message ? err.message : String(err);
  document.body.replaceChildren(pre);
}
function tailwind() {
  return new Promise((resolve) => {
    const st = document.createElement('style');
    st.type = 'text/tailwindcss';
    st.textContent = '@custom-variant dark (&:where(.dark, .dark *));'; // the canvas's Light/Dark switch drives dark: classes
    document.head.append(st);
    const s = document.createElement('script');
    s.src = TAILWIND;
    s.onload = resolve;
    s.onerror = () => { send({ type: 'log', level: 'warn', text: 'Tailwind didn’t load: its classes are unstyled.' }); resolve(); };
    document.head.append(s);
  });
}

let started = false;
addEventListener('message', async (e) => {
  if (e.source !== parentWin) return;
  const m = e.data || {};
  if (m.type === 'theme') { theme(m.theme); return; }
  if (m.type !== 'render' || started) return;
  started = true;
  theme(m.theme);
  try {
    if (m.tailwind) await tailwind();
    const mod = await import(URL.createObjectURL(new Blob([String(m.js)], { type: 'text/javascript' })));
    if (m.mount) {
      const Comp = mod.default;
      if (typeof Comp !== 'function' && !(Comp && typeof Comp === 'object' && Comp.$$typeof)) {
        throw new Error('Nothing to show: make the component the default export (export default function App() { … }).');
      }
      const [{ createElement, Component }, { createRoot }] = await Promise.all([import('react'), import('react-dom/client')]);
      class Boundary extends Component {
        constructor(p) { super(p); this.state = { err: null }; }
        static getDerivedStateFromError(err) { return { err }; }
        render() { return this.state.err ? createElement('pre', { id: 'eden-error' }, String(this.state.err.message || this.state.err)) : this.props.children; }
      }
      createRoot(document.getElementById('root')).render(createElement(Boundary, null, createElement(Comp)));
    }
    send({ type: 'rendered' });
  } catch (err) {
    showError(err);
    send({ type: 'error', text: fmt(err) });
  }
});
send({ type: 'ready' });
// React fetched while the frame waits (canvas-app.js loads a spare frame ahead of the next draw): the code's own imports then find it loaded
Promise.all([import('react'), import('react/jsx-runtime'), import('react-dom/client')]).catch(() => { /* the draw reports it */ });
</script>
