<div id="app">
  <aside id="sidebar" class="glass" aria-label="Courses and study chats">
    <div class="edu-side-head">
      <span class="edu-logo" aria-hidden="true"></span>
      <div class="grow"><b>Eden</b> <span>for Education</span></div>
    </div>
    <nav class="side-scroll" id="eduSide" aria-label="Courses"></nav>
    <div class="side-foot">
      <div class="orb" aria-hidden="true"></div>
      <div class="grow"><div class="who">Eden</div><a class="edu-open" href="/">Open the full app</a> · <button type="button" class="edu-tour-btn" id="eduTour">Take the tour</button></div>
      <button type="button" class="iconbtn" id="eduTheme" title="Appearance" aria-label="Toggle appearance"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
    </div>
  </aside>
  <main id="center">
    <header id="titlebar" class="glass">
      <button type="button" class="iconbtn" id="eduMenu" aria-controls="sidebar" aria-label="Show courses" title="Courses"><svg class="ic" aria-hidden="true"><use href="#i-side"/></svg></button>
      <span class="edu-tb-logo" aria-hidden="true"></span>
      <span class="tb-title" id="eduTitle">Eden for Education</span>
      <span class="edu-tb-badge" id="eduBadge" hidden></span>
      <span style="flex:1"></span>
      <div id="eduActs" class="edu-tb-acts"></div>
    </header>
    <div id="eduView" class="edu-view" tabindex="-1"></div>
  </main>
  <!-- the study companion (study.js): opens on the right, as Eden's browser does -->
  <section id="companion" class="glass" aria-label="Study companion" aria-hidden="true" inert></section>
  <!-- the notebook (notebook.js, edu-app.js): on the right too; one panel at a time -->
  <section id="notebookPane" class="glass" aria-label="Notebook" aria-hidden="true" inert></section>
</div>
<div id="eduScrim" class="edu-scrim" hidden></div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
<script type="module" src="edu-app.js"></script>
</body>
