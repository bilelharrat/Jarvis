      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
