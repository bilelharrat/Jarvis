const CSS = `
.et{${LIGHT};--ease:cubic-bezier(.32,.72,0,1);position:relative;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}

.et *,.et *::before,.et *::after{box-sizing:border-box}
:where(.et) :is(h1,h2,h3,h4,p,ol,ul,dl){margin:0}

.et-p{color:var(--text2);margin-top:8px;line-height:1.55}

.et-big{font-size:26px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.et-big span{font-size:15px;font-weight:500;color:var(--text2)}

.et-band{position:relative;z-index:1;color:#fff;background:var(--band);padding:14px 24px 96px;overflow:hidden;border-radius:20px;margin:12px 12px 0 0;container-type:inline-size;box-shadow:var(--shadow)}

.et-tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.et-switch{margin:0 auto;max-width:100%}
.et-bar-actions{display:flex;gap:8px}

.et-kicker-band{color:rgba(255,255,255,.66)}

.et-meta{display:flex;gap:8px;flex-wrap:wrap}
.et-meta span{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:13px;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}

.et-seg{position:relative;display:inline-flex;padding:4px;gap:2px;border-radius:999px;max-width:100%}
.et-seg>button{position:relative;z-index:1;min-height:40px;padding:0 14px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:550;white-space:nowrap;transition:color 260ms var(--ease),transform 200ms var(--ease)}

.et-seg-dark>button{color:rgba(255,255,255,.8)}.et-seg-dark>button:hover{color:#fff}
.et-seg-dark>button[data-on=true]{color:#0E2747}
.et-seg-dark .et-seg-thumb{background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.22),inset 0 1px 0 #fff}
.et-sw{display:inline-flex;align-items:center;gap:8px}

.et-seg-light .et-seg-thumb{background:var(--content);box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.08)}
.et-seg-glass{background:var(--glass);border:1px solid var(--hairline);box-shadow:inset 0 1px 0 var(--rim),var(--shadow);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.et-seg-glass>button{color:var(--text2)}.et-seg-glass>button[data-on=true]{color:#fff}
.et-seg-glass .et-seg-thumb{background:var(--accent)}

/* buttons */
.et-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--hairline);background:var(--inner);color:var(--text);font-size:14px;font-weight:550;white-space:nowrap;box-shadow:inset 0 1px 0 var(--rim);transition:transform 240ms var(--ease),box-shadow 240ms var(--ease),background 240ms var(--ease)}
.et-btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--rim),0 6px 16px rgba(0,0,0,.10)}
.et-btn:active{transform:scale(.98)}
.et-btn-primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px rgba(0,113,227,.32)}
.et-btn-primary:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px rgba(0,113,227,.4)}
.et-btn-quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink)}
.et-btn-quiet:hover{background:var(--fill);box-shadow:none}
.et-btn-danger{color:#d70015;background:transparent;border-color:var(--hairline)}
.et[data-theme=dark] .et-btn-danger{color:#ff6961}
.et-btn-sm{min-height:40px;padding:0 12px;font-size:13.5px}
.et-btn-block{width:100%;margin-top:12px}
.et-btn-band{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.et-btn-icon{width:40px;padding:0}
.et-icon-btn{width:40px;height:40px;flex:none;border-radius:999px;display:grid;place-items:center;color:var(--text2);transition:background 220ms var(--ease),transform 220ms var(--ease)}
.et-icon-btn:hover{background:var(--fill);color:var(--text)}.et-icon-btn:active{transform:scale(.94)}
.et-icon-glass{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.7);color:#1d1d1f;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.et-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.et-glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--hairline);border-radius:20px;box-shadow:inset 0 1px 0 var(--rim),var(--shadow)}
.et-inner{background:var(--inner);border:1px solid var(--hairline);border-radius:14px}
.et-card-pad{padding:22px}

.et-lift:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--rim),var(--shadow-f)}
.et-lift:active{transform:scale(.98)}

@keyframes et-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.et-main{position:relative;z-index:2;max-width:1360px;margin:0 auto;padding:20px 12px 24px 0;outline:none}

.et-thumb{width:58px;height:58px;border-radius:13px;display:block;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.06)}

.et-leg{position:relative;display:flex;align-items:center;min-height:34px;padding-left:122px;font-size:12.5px;color:var(--text3)}
.et-leg::before{content:"";position:absolute;left:94px;top:0;bottom:0;border-left:2px dotted var(--hair3)}
.et-leg-ico{position:absolute;left:83px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--content);color:var(--text2);box-shadow:0 0 0 1px var(--hairline)}
/* map */
.et-map{position:relative;overflow:hidden;border-radius:16px;background:var(--m-land);isolation:isolate;box-shadow:inset 0 0 0 1px var(--hairline)}

.et-map[data-ready=false] .et-cam{transition:none}
.et-land{fill:var(--m-land)}.et-land2{fill:var(--m-land2)}.et-st{stroke:var(--m-street);stroke-width:4;fill:none}.et-park{fill:var(--m-park)}.et-water{fill:var(--m-water)}
.et-road-c{stroke:var(--m-roadc);stroke-width:11;fill:none;stroke-linecap:round}.et-road{stroke:var(--m-road);stroke-width:7;fill:none;stroke-linecap:round}
.et-bridge{stroke:#c8463c;stroke-width:6;fill:none}
.et-lbl{font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.16em;fill:var(--m-label)}
.et-wlbl{font:italic 500 24px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.4em;fill:var(--m-wlabel)}
.et-route-c{stroke:var(--m-routec);fill:none;stroke-linecap:round;stroke-linejoin:round}
.et-route{stroke:var(--accent2);fill:none;stroke-linecap:round;stroke-linejoin:round}
.et-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:et-draw 600ms var(--ease) 80ms forwards}
@keyframes et-draw{to{stroke-dashoffset:0}}
.et-ghost{stroke:var(--accent2);opacity:.28;fill:none;stroke-linecap:round;stroke-dasharray:2 10}
.et-pin,.et-hotel,.et-mchip,.et-you{position:absolute;left:0;top:0;transition:transform 360ms var(--ease)}
.et-map[data-ready=false] .et-pin{transition:none}
.et-pin{width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;border-radius:50%;z-index:3}
.et-pin-dot{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 4px 12px rgba(0,40,100,.35);transition:transform 280ms var(--ease),box-shadow 280ms var(--ease)}
.et-pin:hover .et-pin-dot,.et-pin[data-hov=true] .et-pin-dot{transform:translateY(-2px) scale(1.08)}
.et-pin[data-sel=true]{z-index:5}
.et-pin[data-sel=true] .et-pin-dot{transform:scale(1.25);box-shadow:0 0 0 7px var(--halo),0 6px 16px rgba(0,40,100,.4)}
.et-pin-lbl{position:absolute;left:40px;top:50%;transform:translate(-4px,-50%);white-space:nowrap;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--chipbg);color:var(--text);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 0 0 1px var(--hairline),0 6px 16px rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:opacity 240ms var(--ease),transform 240ms var(--ease)}
.et-pin:hover .et-pin-lbl,.et-pin:focus-visible .et-pin-lbl,.et-pin[data-sel=true] .et-pin-lbl,.et-pin[data-hov=true] .et-pin-lbl{opacity:1;transform:translate(0,-50%)}
.et-pin-alt .et-pin-dot{background:var(--content);color:var(--ink);border-color:var(--content);box-shadow:0 0 0 1px var(--hairline),0 4px 12px rgba(0,0,0,.18)}
.et-pin-alt[data-sel=true] .et-pin-dot{background:var(--accent);color:#fff;border-color:#fff}
.et-hotel{margin:-15px 0 0 -15px;z-index:2;display:flex;align-items:center;gap:6px;pointer-events:none}

.et-hotel em{font-style:normal;font-size:11.5px;font-weight:650;color:var(--text);background:var(--chipbg);padding:3px 8px;border-radius:999px;box-shadow:0 0 0 1px var(--hairline)}
.et-mchip{z-index:2;margin:0;display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--text2);background:var(--chipbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 0 0 1px var(--hairline),0 2px 6px rgba(0,0,0,.08);translate:-50% -50%;pointer-events:none}
.et-you{z-index:4;pointer-events:none}
.et-you i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#0a84ff;border:3px solid #fff;box-shadow:0 0 0 8px rgba(10,132,255,.2),0 2px 6px rgba(0,0,0,.3)}

.et-mapcap{position:absolute;right:12px;top:12px;z-index:6;font:600 10.5px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);background:var(--chipbg);padding:6px 10px;border-radius:999px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 0 0 1px var(--hairline)}
.et-mover{position:absolute;top:12px;left:12px;z-index:6;max-width:calc(100% - 24px)}
.et-glass-chip{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 13px;border-radius:999px;font-size:13px;color:var(--text2);background:var(--chipbg);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 var(--rim),0 0 0 1px var(--hairline),0 6px 16px rgba(0,0,0,.08)}

.et-offnote{position:absolute;top:56px;left:12px;z-index:6;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--chipbg);color:var(--text);box-shadow:0 0 0 1px var(--hairline);max-width:calc(100% - 24px)}
.et-mhint{position:absolute;left:12px;bottom:12px;z-index:6}
/* partner */

.et-bubble{display:flex;gap:10px;align-items:flex-start}

.et-chips{display:flex;flex-direction:column;gap:8px}
.et-chipbtn{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:12px;text-align:left;font-size:14px;font-weight:550;background:var(--inner);border:1px solid var(--hairline);color:var(--ink);box-shadow:inset 0 1px 0 var(--rim)}
.et-thread{display:flex;flex-direction:column;gap:12px}

.et-me{align-self:flex-end;max-width:85%;background:var(--accent);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:14px}

.et-ask{display:flex;gap:8px;align-items:center;padding:5px 5px 5px 14px;border-radius:999px;background:var(--inner);border:1px solid var(--hairline);transition:box-shadow 220ms var(--ease)}

/* journey */
.et-hero{position:relative;overflow:hidden;min-height:330px;display:flex;align-items:center;padding:28px}

.et-hs1{stop-color:var(--hs1)}.et-hs2{stop-color:var(--hs2)}.et-hsun{fill:var(--hsun)}.et-hh1{fill:var(--hh1)}.et-hdim{fill:var(--hdim)}.et-hriver{fill:var(--hriver)}

.et-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.et-col{overflow:hidden;display:flex;flex-direction:column}
.et-col[data-on=true]{box-shadow:inset 0 0 0 1.5px var(--ring),var(--shadow-f)}
.et-col-art{position:relative;height:140px}
.et-col-img{width:100%;height:100%;display:block}
.et-col-day{position:absolute;left:10px;bottom:10px;font:600 11px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.82);color:#1d1d1f;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.et-col-body{padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;flex:1}

.et-mini-tl{display:grid;gap:5px;margin:6px 0 4px;flex:1}

.et-col .et-btn{align-self:flex-start;margin-left:-8px}
.et-legend{font-size:13px;color:var(--text2)}

.et-xcard-body{display:flex;flex-direction:column;gap:3px;min-width:0}

.et-morning{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(150deg,#0E2747,#1d4c80);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}

.et-morning-h{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.08;margin:12px 0 6px}

.et-next{padding:16px}

.et-today-ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--text2)}
.et-today-t{font:600 12.5px ui-monospace,"SF Mono",Menlo,monospace;color:var(--text3)}
.et-today em{font-style:normal;font-size:12px;font-weight:650;color:var(--text3)}

.et-sheet{position:fixed;z-index:51;top:12px;right:12px;bottom:12px;width:min(460px,calc(100vw - 24px));display:flex;flex-direction:column;border-radius:20px;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--hairline);box-shadow:inset 0 1px 0 var(--rim),var(--shadow-f);transform:translateX(calc(100% + 24px));transition:transform 340ms var(--ease)}

.et-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 12px 6px 22px}

.et-sheet-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--hairline)}
.et-sheet-art{height:150px;border-radius:14px;overflow:hidden;margin:4px 0 14px}
.et-facts-grid{margin-bottom:6px}
.et-grabber{display:none;width:38px;height:5px;border-radius:3px;background:var(--hair3);margin:8px auto 0}
