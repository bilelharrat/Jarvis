# askeden.com: the J.A.R.V.I.S. site and the app file, on Cloudflare (see src/worker.js).
# Deploy: npx wrangler deploy (from this folder, after npx wrangler login).
name = "jarvis-download"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# request.signal aborts when the browser goes away: Stop on a request answered by the owner's
# Mac reaches the Mac (src/accounts/webrelay.js); a stream's cancel alone isn't always called.
compatibility_flags = ["enable_request_signal"]
workers_dev = false

# The whole domain: the old Eden site on Vercel is no longer shown at askeden.com.
routes = [
  { pattern = "askeden.com/*", zone_name = "askeden.com" },
  { pattern = "www.askeden.com/*", zone_name = "askeden.com" },
  { pattern = "edu.askeden.com", custom_domain = true }, # Eden for Education: forwards to askeden.com/edu (worker.js)
  # Eden for Education's home:
  { pattern = "askedenedu.com/*", zone_name = "askedenedu.com" }, # Eden for Education's home (EDU_HOST)
  { pattern = "www.askedenedu.com/*", zone_name = "askedenedu.com" }, # forwards to askedenedu.com (worker.js)
  # Eden Code's home:
  { pattern = "askedencode.com/*", zone_name = "askedencode.com" }, # Eden Code's home (CODE_HOST)
  { pattern = "www.askedencode.com/*", zone_name = "askedencode.com" }, # forwards to askedencode.com (worker.js)
  { pattern = "askedennews.com", custom_domain = true }, # Eden News' home (NEWS_HOST); the deploy makes its DNS record
  { pattern = "www.askedennews.com", custom_domain = true }, # forwards to askedennews.com (worker.js)
  # Their DNS records are made by the deploy itself (custom_domain), as for edu.askeden.com. Secretary and Daredevil have homes
  # (SECRETARY_HOST, DAREDEVIL_HOST); the rest are doorways (worker.js).
  { pattern = "askeden.net", custom_domain = true },
  { pattern = "www.askeden.net", custom_domain = true },
  { pattern = "askeden.org", custom_domain = true },
  { pattern = "www.askeden.org", custom_domain = true },
  { pattern = "askedenrouter.com", custom_domain = true },
  { pattern = "www.askedenrouter.com", custom_domain = true },
  { pattern = "edenrouter.com", custom_domain = true },
  { pattern = "www.edenrouter.com", custom_domain = true },
  { pattern = "edencode.app", custom_domain = true },
  { pattern = "www.edencode.app", custom_domain = true },
  { pattern = "edencode.dev", custom_domain = true },
  { pattern = "www.edencode.dev", custom_domain = true },
  { pattern = "codewitheden.com", custom_domain = true },
  { pattern = "www.codewitheden.com", custom_domain = true },
  { pattern = "evesverification.com", custom_domain = true },
  { pattern = "www.evesverification.com", custom_domain = true },
  { pattern = "edenverification.com", custom_domain = true },
  { pattern = "www.edenverification.com", custom_domain = true },
  { pattern = "edensecretary.com", custom_domain = true },
  { pattern = "www.edensecretary.com", custom_domain = true },
  { pattern = "askedensecretary.com", custom_domain = true },
  { pattern = "www.askedensecretary.com", custom_domain = true },
  { pattern = "edendaredevil.com", custom_domain = true },
  { pattern = "www.edendaredevil.com", custom_domain = true },
  # Eden Mail's home (MAIL_HOST), once askedenmail.com is a site on this Cloudflare account (TODO.md):
  { pattern = "askedenmail.com", custom_domain = true },
  { pattern = "www.askedenmail.com", custom_domain = true },
  # Ask Eden Travel's home (TRAVEL_HOST), held: uncomment once askedentravel.com is a site on this Cloudflare account, its DNS
  # record is set (proxied A @ 192.0.2.1, CNAME www @) and the owner says go (TODO.md):
  # { pattern = "askedentravel.com/*", zone_name = "askedentravel.com" },
  # { pattern = "www.askedentravel.com/*", zone_name = "askedentravel.com" },
  # And once askeden.ai is a zone here too (forwards to askeden.com, worker.js):
  # { pattern = "askeden.ai/*", zone_name = "askeden.ai" },
  # { pattern = "www.askeden.ai/*", zone_name = "askeden.ai" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# The JARVIS voice (POST /api/voice): the Fish Audio key is a secret,
#   npx wrangler secret put FISH_API_KEY
# and these are the daily allowances in characters (src/worker.js LIMITS has the defaults).
[vars]
# Eden for Education at its own address (src/worker.js route): "askedenedu.com", with its routes above;
# askeden.com/edu and edu.askeden.com then forward to it.
EDU_HOST = "askedenedu.com"
# Eden Code at its own address (src/worker.js route): "askedencode.com", with its routes above; askeden.com/eden-code then forwards to it.
CODE_HOST = "askedencode.com"
# Eden News (src/news/): on, at askedennews.com (askeden.com/news forwards), from the live sources (src/news/sources.js:
# Yahoo Finance search as BSH Research Center does, Google News RSS, publisher RSS). NEWS_PROVIDER = "sample" for made-up stories.
EDEN_NEWS = "on"
# EDEN_NEWS_IN_APP = "on" # the News button and panel inside the chat app (web/chat/news-panel.js); off until the owner says ship it
# EDEN_IMAGES = "on" # pictures in chat: GPT Image (src/eden/image.js); held until Eden for iPhone 1.0 passes App Review. EDEN_IMAGE_MODEL picks the model.
# EDEN_SIGNIN_CHOICE = "on" # /signin's "You last signed in here with…" and the question before a second account (src/eden/session.js); held until App Review passes.
NEWS_HOST = "askedennews.com"
NEWS_PROVIDER = "live"
# Eden Secretary and Eden Daredevil at their own addresses (src/worker.js route), with their routes above; askeden.com/eden-secretary,
# askedensecretary.com and askeden.com/daredevil then forward to them.
# On: the deploy makes their DNS records (custom_domain routes above).
SECRETARY_HOST = "edensecretary.com"
DAREDEVIL_HOST = "edendaredevil.com"
# Eden Mail's page at its own address (src/worker.js route): "askedenmail.com"; the app stays at askeden.com/mail.
# On (2026-10-14): askedenmail.com is a site on this Cloudflare account.
MAIL_HOST = "askedenmail.com"
# Eden Router at its own address (src/worker.js route): "edenrouter.com", with its routes above; askedenrouter.com forwards to it.
# The owner approved the page and its numbers on 2026-10-14.
ROUTER_HOST = "edenrouter.com"
# EVES at its own address (src/worker.js route): "evesverification.com"; edenverification.com, www and askeden.com/eves forward to it.
EVES_HOST = "evesverification.com"
# Ask Eden Travel at its own address (src/worker.js route): "askedentravel.com"; askeden.com/travel and www then forward to it.
# Held (2026-10-26): the page is built (public/travel-home/) but stays off until the owner says go and the deploy freeze lifts.
# TRAVEL_HOST = "askedentravel.com"
FISH_MODEL = "s2.1-pro-free"  # what the owner's own JARVIS voice uses
VOICE_DAILY_PER_INSTALL = "20000"
VOICE_DAILY_PER_NETWORK = "40000"
VOICE_DAILY_TOTAL = "400000"
# Jarvis accounts (docs/accounts.md): allowances in dollars of AI at list prices, and the
# JARVIS voice per account a day. Secrets: ANTHROPIC_API_KEY, APNS_KEY, APNS_KEY_ID, and
# optionally SIWA_KEY, SIWA_KEY_ID (wrangler secret put NAME).
# PLUS_BUDGET_USD: a month of today's Plus ($10/month or $96/year); PLUS_LEGACY_BUDGET_USD: a
# month of grandfathered Plus (the old $20 Stripe price, STRIPE_PRICE_PLUS_LEGACY, and the App Store).
PLUS_BUDGET_USD = "6"
PLUS_LEGACY_BUDGET_USD = "20"
TRIAL_BUDGET_USD = "1"
VOICE_DAILY_FREE = "20000"
VOICE_DAILY_PLUS = "100000"
# The Apple Developer team (individual, Bilel Harrat) the apps, the push key and the Sign in
# with Apple key belong to.
APPLE_TEAM_ID = "8CV4X23Y2T"
# The page's other download buttons (src/worker.js SOON): https addresses, e.g. a TestFlight
# public link or the Messenger's notarized .dmg. Empty: the button shows "almost ready".
# Eden Code alone (app/ npm run dist:eden-code, notarized): its .dmg. J.A.R.V.I.S.'s disk image carries it too.
EDEN_CODE_MAC_URL = ""
JARVIS_IPHONE_URL = ""
MESSENGER_MAC_URL = "https://askeden.com/jarvis/eden/Eden-Messenger.dmg"
MESSENGER_IPHONE_URL = ""
# Eden at askeden.com/ (src/eden/, providers.js): the models hosted Eden routes among, on the
# account's included AI. A model is a candidate only while its provider has a key: secrets
# OPENAI_API_KEY, GEMINI_API_KEY (also the Gemini rating), MOONSHOT_API_KEY, each optional
# (wrangler secret put NAME). Claude is bring-your-own-key only: hosted chat never uses
# ANTHROPIC_API_KEY; a person's own Anthropic key (Settings › Models & API keys) or the owner's
# Mac runs it, and elsewhere Claude's models show locked. EDEN_ANTHROPIC / EDEN_OPENAI / EDEN_GEMINI /
# EDEN_KIMI = "off" switch one off with its key in place. EDEN_MODELS = "all": every registry
# model not deprecated. Then the highest effort, the longest reply and conversation, web searches
# a search turn may make (twice that for research). Model ids are the Model Router's.
EDEN_MODELS = "claude-opus-5-5,claude-sonnet-5-5,gpt-6.1-sol,gemini-4-argon,gemini-3.8-flash,gemini-3.5-flash-lite,kimi-k3"
EDEN_MAX_EFFORT = "high"
EDEN_MAX_TOKENS = "131072"
EDEN_MAX_INPUT_TOKENS = "1000000"
EDEN_SEARCH_USES = "5"
# Account ids (commas) that may sign in to Eden on the web; empty: every Jarvis account.
EDEN_ACCOUNTS = ""
# Help's chat (src/eden/help.js, POST /api/help/ask): free to the person, capped per account a day
# (UTC; four times that per network), on Eden's own daily budget for Help (not the account's allowance).
HELP_DAILY_MESSAGES = "30"
HELP_DAILY_SCREENSHOTS = "5"
HELP_DAILY_BUDGET_USD = "5"
HELP_MAX_TOKENS = "700"
HELP_MODEL = "claude-haiku-4-5"
# Sign in with Apple on the web: the Services ID for askeden.com, www and preview (primary App
# ID com.askeden.jarvis; docs/web-auth.md "Owner steps"); empty keeps it off. Signing in with a
# code works without it.
WEB_APPLE_SERVICES_ID = "com.askeden.eden.web"
# Sign in with Google: the OAuth client id (….apps.googleusercontent.com) once it exists, with
# the secret GOOGLE_CLIENT_SECRET (npx wrangler secret put GOOGLE_CLIENT_SECRET). Either one
# missing keeps Google off (docs/web-auth.md "Owner steps").
# Gmail and Google Calendar on the web (src/eden/google-data.js) use the same client, plus the
# secret EDEN_TOKEN_KEY (32 random bytes, base64) that seals their tokens; without it they stay "needs your Mac".
GOOGLE_CLIENT_ID = "276467237017-cr8pkfhbunm94on8vbi6o0pj11tq7bdm.apps.googleusercontent.com"
# Plus on the web with Stripe (src/eden/billing.js; docs/web-auth.md "Billing on the web (Stripe)"),
# beside the App Store. Secrets: STRIPE_SECRET_KEY (sk_test_… for now) and STRIPE_WEBHOOK_SECRET
# (whsec_…). STRIPE_PRICE_PLUS: the "Eden Plus" price ids (several, commas: the first
# for new subscriptions). Any of the three missing keeps billing off. A live key is refused unless
# STRIPE_LIVE = "1". STRIPE_IN_EDEN_APP = "1" also offers it inside the Eden iOS app (off: Apple's
# in-app purchase rules; for the US link-out later).
#
# Pricing (src/eden/billing.js): the owner creates these in Stripe's LIVE mode, then fills them in.
# Until then each empty one stays hidden, and Plus is sold at the old $20 price as before.
#   STRIPE_PRICE_PLUS: put today's "Eden Plus" $10/month price FIRST, then keep the old $20 one:
#     STRIPE_PRICE_PLUS = "price_NEW10,price_1UNyviRqjDshFbQioPdAvCuu"
#   STRIPE_PRICE_PLUS_LEGACY: the old $20/month price: honoured with $20 of AI a month, never sold
#     (unless it is STRIPE_PRICE_PLUS's first).
#   STRIPE_PRICE_PLUS_YEARLY: "Eden Plus" $96/year (recurring yearly). Empty: no yearly option.
#   STRIPE_PRICE_CREDITS_5/_10/_25: "Eden credits" one-time prices $5, $10, $25. Empty: that pack
#     isn't offered; auto top-up needs the $10 one. Webhook events to add to the Stripe endpoint:
#     payment_intent.succeeded and payment_intent.payment_failed (checkout.session.completed already).
STRIPE_PRICE_PLUS = "price_1UOCZhRqjDshFbQi1pFBWRp8"
STRIPE_PRICE_PLUS_LEGACY = "price_1UNyviRqjDshFbQioPdAvCuu"
STRIPE_PRICE_PLUS_YEARLY = "price_1UOCZRRqjDshFbQi1IDfzaWI"
STRIPE_PRICE_CREDITS_5 = ""
STRIPE_PRICE_CREDITS_10 = ""
STRIPE_PRICE_CREDITS_25 = ""
STRIPE_LIVE = "1"
STRIPE_IN_EDEN_APP = ""
# Cloudflare Turnstile on sign-up (src/accounts/turnstile.js; docs/web-auth.md "Turnstile"): the
# widget's site key here, and the secret TURNSTILE_SECRET (npx wrangler secret put TURNSTILE_SECRET).
# Either empty: no person check on new accounts (logged once per isolate).
TURNSTILE_SITE_KEY = "0x4AAAAAAFQFdYSc-3A61zIC"
# Who may make a new Eden account (src/accounts/turnstile.js; docs/web-auth.md "Sign-ups"): "open",
# or "owner" (existing accounts sign in and link as always; every new one is refused with
# "Eden is opening soon — sign-ups are closed for now"). "open" without both Turnstile keys counts
# as "owner" (fail closed). The preview is "open" with TURNSTILE_OPTIONAL (scripts/preview-config.mjs).
SIGNUPS = "open"
OWNER_DOMAINS = "askeden.com" # verified emails here may make their account while sign-ups are closed

# Dictation by recording where the browser has no speech recognition (Firefox; ROADMAP G7.2):
# Workers AI's Whisper (src/eden/transcribe.js), counted on the account's included AI. A new
# binding, no secret: Workers AI must be on for the Cloudflare account. Workers AI has no local
# simulator, so `wrangler dev` (even --local) opens a remote session for it and a transcription
# there is real and billed; QA configs can leave [ai] out and pass a fake AI (test/transcribe.test.js).
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "VOICE_QUOTA"
class_name = "VoiceQuota"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[durable_objects.bindings]]
name = "LINKS"
class_name = "Link"

# Sign-in identities (Apple ID, Google account) → their Eden account (src/accounts/identity.js).
[[durable_objects.bindings]]
name = "IDENTITIES"
class_name = "Identity"

# Team spaces (ROADMAP G8): members, roles, the budget's settings and sealed shared conversations.
[[durable_objects.bindings]]
name = "SPACES"
class_name = "Space"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceQuota"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Account", "Link"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Identity"]

# Team spaces (src/accounts/space.js): one per space, plus its invitation index objects.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["Space"]

# Eden's cloud browser (src/browser/session.js): one per account, a Chrome on Browser Rendering.
[[durable_objects.bindings]]
name = "BROWSER_SESSIONS"
class_name = "BrowserSession"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["BrowserSession"]

# Eden for Education (src/edu/course.js): one per course, plus join-code and per-account index objects.
[[durable_objects.bindings]]
name = "COURSES"
class_name = "Course"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["Course"]

[[durable_objects.bindings]]
name = "PROMOS"
class_name = "Promo"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["Promo"]

# Eden News: readers' profiles and the shared story cache (src/news/store.js)
[[durable_objects.bindings]]
name = "NEWS"
class_name = "NewsDesk"

[[migrations]]
tag = "v8"
new_sqlite_classes = ["NewsDesk"]

# Eden Router API, private beta (src/router-api/): its clients (keys kept hashed), limits and usage log, one object.
# Admin calls need the secret ROUTER_ADMIN_TOKEN (npx wrangler secret put ROUTER_ADMIN_TOKEN); unset, the API answers 503.
[[durable_objects.bindings]]
name = "ROUTER_API"
class_name = "RouterApi"

[[migrations]]
tag = "v9"
new_sqlite_classes = ["RouterApi"]

# Browser Rendering (Workers Paid: 10 browser hours and 10 concurrent browsers a month included).
[browser]
binding = "BROWSER"

[[ratelimits]]
name = "VOICE_RATE"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Linking a Mac: starts per network, lookups per account, polls per code.
[[ratelimits]]
name = "LINK_RATE"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Included AI: requests a minute per account.
[[ratelimits]]
name = "API_RATE"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

# Chat history sync (accounts/chat-sync.js): calls a minute per account. A first upload is one call per chat.
[[ratelimits]]
name = "CSYNC_RATE"
namespace_id = "1008"
simple = { limit = 600, period = 60 }

# Signing in on the web (docs/web-auth.md): Apple and Google starts and callbacks, the Eden
# app's handoffs, and new accounts, each a minute per network.
[[ratelimits]]
name = "AUTH_RATE"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

# Hosted Eden: chat turns a minute per account (the included-AI allowance caps the cost).
[[ratelimits]]
name = "EDEN_RATE"
namespace_id = "1005"
simple = { limit = 20, period = 60 }

# The cloud browser: connects a minute per account.
[[ratelimits]]
name = "BROWSER_RATE"
namespace_id = "1006"
simple = { limit = 20, period = 60 }

# The code canvas's cloud runs a minute per account (src/eden/run.js).
[[ratelimits]]
name = "RUN_RATE"
namespace_id = "1007"
simple = { limit = 20, period = 60 }

# The owner's dashboard (askeden.com/admin, src/stats/): visits, downloads, sign-ups, AI use, errors.
# ADMIN_EMAILS (who may open it) and UNLIMITED_EMAILS (Plus with no real allowance, the owner's family)
# are secrets, so the addresses stay out of this public repo: npx wrangler secret put ADMIN_EMAILS
# HELD until Eden for iPhone 1.0 passes App Review (owner, 2026-10-13): uncomment to turn the dashboard on.
# [[d1_databases]]
# binding = "STATS"
# database_name = "askeden-stats"
# database_id = "7a373e9a-c92f-4c7e-8e53-45de84aff9b5"

# Keep the R2 bucket last: wrangler.nor2.toml is this file up to here (deploys before R2).
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "jarvis-downloads"
