<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>Browser</title>
<link rel="stylesheet" href="popout.css">
</head>
<body>
<form id="bar" class="bar" autocomplete="off">
  <button type="button" class="icon" id="back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg></button>
  <button type="button" class="icon" id="forward" aria-label="Forward"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
  <button type="button" class="icon" id="reload" aria-label="Reload"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 11-1.5-3.6M13 2.5v3h-3"/></svg></button>
  <input id="address" spellcheck="false" autocomplete="off" aria-label="Address">
  <button type="button" class="dock" id="dock"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.8"/><path d="M9.5 2.8v10.4"/></svg><span id="dock-label">Back to the dock</span></button>
  <i id="progress" class="progress" hidden></i>
</form>
<script src="popout.js"></script>
</body>
</html>
