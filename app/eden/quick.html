<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Ask Eden</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1d1d1f; --mute: #86868b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #f5f5f7; } }
  html, body { margin: 0; height: 100%; background: transparent; font: 15px -apple-system, BlinkMacSystemFont, sans-serif; }
  .box { box-sizing: border-box; height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: var(--bg); color: var(--fg); border-radius: 16px; -webkit-app-region: drag; }
  .mark { width: 22px; height: 22px; border-radius: 6px; background: #0e2747; flex: none; }
  input { -webkit-app-region: no-drag; flex: 1; border: 0; outline: 0; background: transparent; color: inherit; font: 500 20px -apple-system, sans-serif; }
  input::placeholder { color: var(--mute); }
</style>
<div class="box"><div class="mark"></div><input id="q" autofocus autocomplete="off" spellcheck="true" placeholder="Ask Eden anything"></div>
<script>
  const q = document.getElementById('q');
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && q.value.trim()) { window.quickAsk.send(q.value.trim()); q.value = ''; }
    else if (e.key === 'Escape') window.quickAsk.close();
  });
  window.addEventListener('focus', () => q.focus());
</script>
