<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#060b16">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/remote.css">
<title>J.A.R.V.I.S.</title>
</head>
<body>
<main id="pair" class="view" hidden>
  <div class="mark" aria-hidden="true"></div>
  <h1>J.A.R.V.I.S.</h1>
  <p class="lede">On your Mac, open Settings › iPhone &amp; Watch and tap <strong>Pair a phone</strong>. Enter the six-digit code here.</p>
  <form id="pair-form" class="pair-form" autocomplete="off">
    <label for="pair-code">Pairing code</label>
    <input id="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
    <label for="pair-name">This device</label>
    <input id="pair-name" maxlength="40" value="iPhone">
    <button type="submit" class="primary">Pair</button>
    <p id="pair-error" class="error" role="alert"></p>
  </form>
</main>

<main id="app" class="view" hidden>
  <header class="top">
    <span class="brand">J.A.R.V.I.S.</span>
    <span id="status" class="status"><i></i><span id="status-text">Connecting…</span></span>
  </header>

  <section class="glance" aria-live="polite">
    <p id="weather" class="glance-line" hidden></p>
    <p id="next-event" class="glance-line" hidden></p>
    <p id="meeting" class="glance-line rec" hidden></p>
  </section>

  <button id="orb" class="orb" type="button" aria-label="Talk: tap, then use the keyboard's microphone"><span></span></button>

  <section class="talk" aria-live="polite">
    <p id="heard" class="heard"></p>
    <p id="reply" class="reply">Tap the orb, then the keyboard’s microphone, and talk.</p>
  </section>

  <section id="approvals" class="approvals" aria-live="assertive"></section>

  <form id="ask-form" class="ask" autocomplete="off">
    <label for="ask-input" class="sr-only">Ask Jarvis</label>
    <input id="ask-input" placeholder="Ask anything…" enterkeyhint="send">
    <button type="submit" class="send" aria-label="Send">➤</button>
  </form>

  <nav class="chips" aria-label="Quick actions">
    <button type="button" class="chip" data-ask="What's next on my calendar today?">What’s next?</button>
    <button type="button" class="chip" data-command="briefing">Brief me</button>
    <button type="button" class="chip" id="notes-btn" data-command="meeting_start">Take notes</button>
    <button type="button" class="chip" data-command="stop">Stop</button>
  </nav>

  <section class="tasks" id="tasks" hidden>
    <h2>Working on</h2>
    <ul id="task-list"></ul>
  </section>

  <footer class="foot">
    <label class="toggle"><input type="checkbox" id="voice" checked> Play replies in Jarvis’s voice</label>
    <button type="button" id="copy-token" class="link">Copy token for the Apple Watch shortcut</button>
    <button type="button" id="unpair" class="link">Unpair this phone</button>
  </footer>
</main>

<audio id="player" preload="none"></audio>
<script src="/remote.js"></script>
</body>
</html>
