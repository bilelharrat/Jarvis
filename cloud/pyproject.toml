[project]
name = "eden-cloud"
version = "0.1.0"
description = "Eden Cloud: hosted Eden Code runs (the server side)."
requires-python = ">=3.12"
dependencies = [
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28",
    "cryptography>=44",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eden_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["eden_cloud", "eden_runner", "fakes"]
