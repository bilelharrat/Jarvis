# Eden Secretary companion (formerly J.A.R.V.I.S.): native iPhone app + Apple Watch app for Eden on the Mac.
# User-visible wording lives here: xcodegen rewrites every Info.plist from these properties, so the
# Eden names must be set here, not only in the plists (tests/test_companion_project_names.py checks).
# Bundle ids, app groups, Bonjour and URL schemes keep their internal "jarvis" names on purpose.
# Generate the Xcode project with:  xcodegen generate   (from this folder)
name: JarvisCompanion
options:
  bundleIdPrefix: com.askeden.jarvis
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
# Lets the Simulator buy Eden Plus without App Store Connect (the scheme's run action).
fileGroups:
  - Jarvis.storekit
settings:
  SWIFT_VERSION: "5.10"
  # The owner's Apple Developer Program team (individual, Bilel Harrat), the same as the Eden app's.
  DEVELOPMENT_TEAM: 8CV4X23Y2T
  CODE_SIGN_STYLE: Automatic
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  JarvisCompanion:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Activity
      - path: ShareKit
      - path: iOS
    dependencies:
      - target: JarvisCompanionWatch
        embed: true
      - target: JarvisWidgets
        embed: true
      - target: JarvisShare
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis
      INFOPLIST_FILE: iOS/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Eden Secretary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Only Apple's own encryption: HTTPS through URLSession (trusted by the certificate's
        # SHA-256, which is a hash, not encryption), the Keychain and WatchConnectivity.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Eden Secretary finds Eden Secretary on your Mac and talks to it over your network.
        NSBonjourServices:
          - _jarvis._tcp
        NSSpeechRecognitionUsageDescription: Turns what you say into a request for Eden Secretary, on your iPhone when it can.
        NSMicrophoneUsageDescription: Listens when you talk to Eden Secretary, and for “Hey Eden” while you have that turned on.
        NSFaceIDUsageDescription: Before your iPhone runs a command on your Mac in Eden Code, or lets a session work without asking, Face ID makes sure it’s you. Also used for “Only answer when unlocked”.
        NSCalendarsFullAccessUsageDescription: So Eden Secretary can tell you what’s on your calendar and add events when you ask, on this iPhone. If you turn on Share my calendar, the next 14 days of events also go to Eden Secretary on your Mac.
        NSRemindersFullAccessUsageDescription: So Eden Secretary can read your reminders, add new ones and tick them off when you ask.
        NSContactsUsageDescription: So Eden Secretary knows who you mean when you ask it to call or text someone. If you turn on contact lookups, your Mac can ask this iPhone “who is…” one name at a time; your address book is never uploaded.
        NSAppleMusicUsageDescription: So Eden Secretary can play your music when you ask.
        NSHomeKitUsageDescription: So Eden Secretary can control your Home accessories and scenes when you ask.
        NSCameraUsageDescription: Scans the pairing code your Mac shows, and takes the photos you choose to show Eden Secretary. With Point and ask on, the camera shows live on your screen and one frame goes to Eden Secretary only when you ask.
        NSLocationWhenInUseUsageDescription: For the weather where you are, travel times and places nearby when you ask Eden Secretary.
        NSLocationAlwaysAndWhenInUseUsageDescription: So Eden Secretary on your Mac knows when you arrive at or leave home and work, even when Eden Secretary isn’t open. Low-power updates only; only your Mac gets it.
        NSHealthShareUsageDescription: Only if you turn on the daily health summary. Steps, sleep, resting heart rate and workouts go to Eden Secretary on your Mac for your briefing. Nothing is written to Health.
        NSHealthUpdateUsageDescription: Eden Secretary never writes to Apple Health. It only reads the daily summary you turn on.
        CFBundleURLTypes:
          - CFBundleURLName: com.askeden.jarvis.pairing
            CFBundleURLSchemes:
              - jarvis-pair
          # Places in the app (widgets, Live Activities); links only ever navigate.
          - CFBundleURLName: com.askeden.jarvis.open
            CFBundleURLSchemes:
              - jarvis-companion
          # A Mac's account link code (its QR code, read by the Camera app); asked about first.
          - CFBundleURLName: com.askeden.jarvis.link
            CFBundleURLSchemes:
              - jarvis-link
        UILaunchScreen:
          UIColorName: LaunchBackground
        # No UIUserInterfaceStyle: Stark Glass keeps the app dark itself (LookRoot), and
        # Obsidian follows the iPhone's appearance.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
          - fetch
          # "Hey Eden" in the background, only while the owner has it turned on.
          - audio
        BGTaskSchedulerPermittedIdentifiers:
          - com.askeden.jarvis.refresh
        NSSupportsLiveActivities: true
        # "Ask Eden Secretary" to Siri, matching the display name.
        INAlternativeAppNames:
          - INAlternativeAppName: Eden Secretary
    entitlements:
      path: iOS/JarvisCompanion.entitlements
      properties:
        # Development builds push through APNs' sandbox. The App Store Connect export signs
        # the TestFlight build with "production" from its distribution profile (archive.sh
        # checks); setting it here would break the development-signed archive.
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.askeden.jarvis
        # Read-only: the daily health summary, off until the owner turns it on.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Home accessories and scenes, asked for the first time Eden Secretary is asked to use them.
        com.apple.developer.homekit: true
        # Timers Eden Secretary sets on the iPhone break through Focus when they end.
        com.apple.developer.usernotifications.time-sensitive: true
        # The optional Eden account (askeden.com) signs in with Apple.
        com.apple.developer.applesignin:
          - Default

  JarvisCompanionWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    dependencies:
      - target: JarvisWatchWidgets
        embed: true
    entitlements:
      path: Watch/JarvisCompanionWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.askeden.jarvis
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis.watchkitapp
      INFOPLIST_FILE: Watch/Info.plist
      GENERATE_INFOPLIST_FILE: false
      WATCHOS_DEPLOYMENT_TARGET: "26.0"
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Eden Secretary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.askeden.jarvis
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Eden Secretary talks to Eden Secretary on your Mac over your network.

  # Home Screen and Lock Screen widgets (and the Live Activities' views).
  JarvisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Activity
      - path: WidgetsCommon
      - path: Widgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis.widgets
      INFOPLIST_FILE: Widgets/Info.plist
      GENERATE_INFOPLIST_FILE: false
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      TARGETED_DEVICE_FAMILY: "1"
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Eden Secretary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/JarvisWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.askeden.jarvis

  # "Send to Eden Secretary" in the share sheet.
  JarvisShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ShareKit
      - path: Share
      - path: iOS/Views/Components.swift
      - path: iOS/Views/SpaceBackground.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis.share
      INFOPLIST_FILE: Share/Info.plist
      GENERATE_INFOPLIST_FILE: false
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      TARGETED_DEVICE_FAMILY: "1"
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Eden Secretary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: Share/JarvisShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.askeden.jarvis

  # Watch complications.
  JarvisWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: WidgetsCommon
      - path: WatchWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis.watchkitapp.widgets
      INFOPLIST_FILE: WatchWidgets/Info.plist
      GENERATE_INFOPLIST_FILE: false
      WATCHOS_DEPLOYMENT_TARGET: "26.0"
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Eden Secretary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/JarvisWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.askeden.jarvis

  JarvisCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JarvisCompanion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis.tests
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      GENERATE_INFOPLIST_FILE: true

  # Runs only against a test server (see README); skips itself otherwise.
  JarvisCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: JarvisCompanion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis.uitests
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      GENERATE_INFOPLIST_FILE: true

  # Eden Code for iPhone: its own App Store app (2026-10-16), on the companion's API, pairing,
  # pinned TLS and relay (Shared, iOS/Account's router and tunnel), with its own screens.
  EdenCode:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Activity/JarvisActivity.swift
      - path: iOS/Account/Account.swift
      - path: iOS/Account/AccountClient.swift
      - path: iOS/Account/MacRouter.swift
      - path: iOS/Account/RelayTunnel.swift
      - path: iOS/Code/CodeAPI.swift
      - path: iOS/Code/OwnerCheck.swift
      - path: EdenCodeCommon
      - path: EdenCode
    dependencies:
      - target: EdenCodeWidgets
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis.edencode
      PRODUCT_NAME: EdenCode
      INFOPLIST_FILE: EdenCode/Info.plist
      # Eden Code's own build number (TestFlight takes each upload's once): 2 since QR pairing,
      # 3 for the TestFlight 2 layout fixes (insets, drawer, model list, Model Router).
      CURRENT_PROJECT_VERSION: "3"
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: EdenCode/Info.plist
      properties:
        CFBundleDisplayName: Eden Code
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Only Apple's own encryption: HTTPS through URLSession (pinned by the certificate's
        # SHA-256), the Keychain.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Eden Code finds Eden on your Mac and talks to it over your network.
        NSBonjourServices:
          - _jarvis._tcp
        NSSpeechRecognitionUsageDescription: Turns what you say into a message for your Eden Code session, on your iPhone when it can.
        NSMicrophoneUsageDescription: Listens while you dictate a message to Eden Code.
        NSCameraUsageDescription: Scans the pairing code your Mac shows in Eden Code › On your phone. Nothing is recorded or sent.
        NSFaceIDUsageDescription: Before your iPhone lets an Eden Code session run a command on your Mac, or allows something from now on, Face ID makes sure it’s you.
        CFBundleURLTypes:
          - CFBundleURLName: com.askeden.jarvis.edencode.open
            CFBundleURLSchemes:
              - edencode
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        NSSupportsLiveActivities: true
    entitlements:
      path: EdenCode/EdenCode.entitlements
      properties:
        # Development builds push through APNs' sandbox; the App Store build is signed with
        # "production" by its distribution profile.
        aps-environment: development
        # The companion's App Group: its keychain group carries the Eden account sign-in the
        # relay needs (signed in once, in the Eden app). Eden Code's own pairings are its own items.
        com.apple.security.application-groups:
          - group.com.askeden.jarvis

  EdenCodeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Activity/JarvisActivity.swift
      - path: EdenCodeCommon
      - path: EdenCodeWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis.edencode.widgets
      INFOPLIST_FILE: EdenCodeWidgets/Info.plist
      CURRENT_PROJECT_VERSION: "3"  # (an extension's build number is its app's)
      GENERATE_INFOPLIST_FILE: false
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      TARGETED_DEVICE_FAMILY: "1"
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: EdenCodeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Eden Code
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EdenCodeWidgets/EdenCodeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.askeden.jarvis

  EdenCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EdenCodeTests
    dependencies:
      - target: EdenCode
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.askeden.jarvis.edencode.tests
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/EdenCode.app/EdenCode
      BUNDLE_LOADER: $(TEST_HOST)

schemes:
  JarvisCompanion:
    build:
      targets:
        JarvisCompanion: all
        JarvisCompanionTests: [test]
        JarvisCompanionUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Jarvis.storekit
    test:
      config: Debug
      targets:
        - JarvisCompanionTests
        - JarvisCompanionUITests
  JarvisCompanionWatch:
    build:
      targets:
        JarvisCompanionWatch: all
    run:
      config: Debug
  EdenCode:
    build:
      targets:
        EdenCode: all
        EdenCodeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EdenCodeTests
