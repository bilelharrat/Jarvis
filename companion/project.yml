# J.A.R.V.I.S. companion: native iPhone app + Apple Watch app for Jarvis on the Mac.
# Generate the Xcode project with:  xcodegen generate   (from this folder)
name: JarvisCompanion
options:
  bundleIdPrefix: com.bshventures.jarvis
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  SWIFT_VERSION: "5.10"
  # BSH Ventures' paid Apple Developer Program team (same as the BSH Research apps).
  DEVELOPMENT_TEAM: 9ZSY5R8A5C
  CODE_SIGN_STYLE: Automatic
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  JarvisCompanion:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Activity
      - path: iOS
    dependencies:
      - target: JarvisCompanionWatch
        embed: true
      - target: JarvisWidgets
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion
      INFOPLIST_FILE: iOS/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: J.A.R.V.I.S.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: J.A.R.V.I.S. finds Jarvis on your Mac and talks to it over your network.
        NSBonjourServices:
          - _jarvis._tcp
        NSSpeechRecognitionUsageDescription: Turns what you say into a request for Jarvis, on your iPhone when it can.
        NSMicrophoneUsageDescription: Listens after you tap the reactor, so you can talk to Jarvis.
        NSCameraUsageDescription: Scans the pairing code your Mac shows, and takes the photos you choose to show Jarvis.
        CFBundleURLTypes:
          - CFBundleURLName: com.bshventures.jarvis.companion.pairing
            CFBundleURLSchemes:
              - jarvis-pair
          # Places in the app (widgets, Live Activities); links only ever navigate.
          - CFBundleURLName: com.bshventures.jarvis.companion.open
            CFBundleURLSchemes:
              - jarvis-companion
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.bshventures.jarvis.companion.refresh
        NSSupportsLiveActivities: true
        # "Ask Jarvis" to Siri: the display name is J.A.R.V.I.S.
        INAlternativeAppNames:
          - INAlternativeAppName: Jarvis
    entitlements:
      path: iOS/JarvisCompanion.entitlements
      properties:
        # Xcode signs Release/TestFlight builds with "production" from the profile.
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.bshventures.jarvis.companion

  JarvisCompanionWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    dependencies:
      - target: JarvisWatchWidgets
        embed: true
    entitlements:
      path: Watch/JarvisCompanionWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bshventures.jarvis.companion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.watchkitapp
      INFOPLIST_FILE: Watch/Info.plist
      GENERATE_INFOPLIST_FILE: false
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.bshventures.jarvis.companion
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: JARVIS talks to Jarvis on your Mac over your network.

  # Home Screen and Lock Screen widgets (and the Live Activities' views).
  JarvisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Activity
      - path: WidgetsCommon
      - path: Widgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.widgets
      INFOPLIST_FILE: Widgets/Info.plist
      GENERATE_INFOPLIST_FILE: false
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1"
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: J.A.R.V.I.S.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/JarvisWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bshventures.jarvis.companion

  # Watch complications.
  JarvisWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: WidgetsCommon
      - path: WatchWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.watchkitapp.widgets
      INFOPLIST_FILE: WatchWidgets/Info.plist
      GENERATE_INFOPLIST_FILE: false
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/JarvisWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bshventures.jarvis.companion

  JarvisCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JarvisCompanion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.tests
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: true

  # Runs only against a test server (see README); skips itself otherwise.
  JarvisCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: JarvisCompanion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.uitests
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: true

schemes:
  JarvisCompanion:
    build:
      targets:
        JarvisCompanion: all
        JarvisCompanionTests: [test]
        JarvisCompanionUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JarvisCompanionTests
        - JarvisCompanionUITests
  JarvisCompanionWatch:
    build:
      targets:
        JarvisCompanionWatch: all
    run:
      config: Debug
