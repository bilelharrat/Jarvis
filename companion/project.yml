# J.A.R.V.I.S. companion: native iPhone app + Apple Watch app for Jarvis on the Mac.
# Generate the Xcode project with:  xcodegen generate   (from this folder)
name: JarvisCompanion
options:
  bundleIdPrefix: com.bshventures.jarvis
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
# Lets the Simulator buy Jarvis Plus without App Store Connect (the scheme's run action).
fileGroups:
  - Jarvis.storekit
settings:
  SWIFT_VERSION: "5.10"
  # BSH Ventures' paid Apple Developer Program team (same as the BSH Research apps).
  DEVELOPMENT_TEAM: 9ZSY5R8A5C
  CODE_SIGN_STYLE: Automatic
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  JarvisCompanion:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Activity
      - path: ShareKit
      - path: iOS
    dependencies:
      - target: JarvisCompanionWatch
        embed: true
      - target: JarvisWidgets
        embed: true
      - target: JarvisShare
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion
      INFOPLIST_FILE: iOS/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: J.A.R.V.I.S.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Only Apple's own encryption: HTTPS through URLSession (trusted by the certificate's
        # SHA-256, which is a hash, not encryption), the Keychain and WatchConnectivity.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: J.A.R.V.I.S. finds Jarvis on your Mac and talks to it over your network.
        NSBonjourServices:
          - _jarvis._tcp
        NSSpeechRecognitionUsageDescription: Turns what you say into a request for Jarvis, on your iPhone when it can.
        NSMicrophoneUsageDescription: Listens when you talk to Jarvis, and for “Hey Jarvis” while you have that turned on.
        NSFaceIDUsageDescription: Before your iPhone runs a command on your Mac in Jarvis Code, or lets a session work without asking, Face ID makes sure it’s you. Also used for “Only answer when unlocked”.
        NSCalendarsFullAccessUsageDescription: So Jarvis can tell you what’s on your calendar and add events when you ask, on this iPhone. If you turn on Share my calendar, the next 14 days of events also go to Jarvis on your Mac.
        NSRemindersFullAccessUsageDescription: So Jarvis can read your reminders, add new ones and tick them off when you ask.
        NSContactsUsageDescription: So Jarvis knows who you mean when you ask it to call or text someone. If you turn on contact lookups, your Mac can ask this iPhone “who is…” one name at a time; your address book is never uploaded.
        NSAppleMusicUsageDescription: So Jarvis can play your music when you ask.
        NSHomeKitUsageDescription: So Jarvis can control your Home accessories and scenes when you ask.
        NSCameraUsageDescription: Scans the pairing code your Mac shows, and takes the photos you choose to show Jarvis. With Point and ask on, the camera shows live on your screen and one frame goes to Jarvis only when you ask.
        NSLocationWhenInUseUsageDescription: For the weather where you are, travel times and places nearby when you ask Jarvis.
        NSLocationAlwaysAndWhenInUseUsageDescription: So Jarvis on your Mac knows when you arrive at or leave home and work, even when J.A.R.V.I.S. isn’t open. Low-power updates only; only your Mac gets it.
        NSHealthShareUsageDescription: Only if you turn on the daily health summary. Steps, sleep, resting heart rate and workouts go to Jarvis on your Mac for your briefing. Nothing is written to Health.
        NSHealthUpdateUsageDescription: J.A.R.V.I.S. never writes to Apple Health. It only reads the daily summary you turn on.
        CFBundleURLTypes:
          - CFBundleURLName: com.bshventures.jarvis.companion.pairing
            CFBundleURLSchemes:
              - jarvis-pair
          # Places in the app (widgets, Live Activities); links only ever navigate.
          - CFBundleURLName: com.bshventures.jarvis.companion.open
            CFBundleURLSchemes:
              - jarvis-companion
          # A Mac's account link code (its QR code, read by the Camera app); asked about first.
          - CFBundleURLName: com.bshventures.jarvis.companion.link
            CFBundleURLSchemes:
              - jarvis-link
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The Stark night: Jarvis is always dark.
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
          - fetch
          # "Hey Jarvis" in the background, only while the owner has it turned on.
          - audio
        BGTaskSchedulerPermittedIdentifiers:
          - com.bshventures.jarvis.companion.refresh
        NSSupportsLiveActivities: true
        # "Ask Jarvis" to Siri: the display name is J.A.R.V.I.S.
        INAlternativeAppNames:
          - INAlternativeAppName: Jarvis
    entitlements:
      path: iOS/JarvisCompanion.entitlements
      properties:
        # Development builds push through APNs' sandbox. The App Store Connect export signs
        # the TestFlight build with "production" from its distribution profile (archive.sh
        # checks); setting it here would break the development-signed archive.
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.bshventures.jarvis.companion
        # Read-only: the daily health summary, off until the owner turns it on.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Home accessories and scenes, asked for the first time Jarvis is asked to use them.
        com.apple.developer.homekit: true
        # Timers Jarvis sets on the iPhone break through Focus when they end.
        com.apple.developer.usernotifications.time-sensitive: true
        # The optional Jarvis account (askeden.com) signs in with Apple.
        com.apple.developer.applesignin:
          - Default

  JarvisCompanionWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    dependencies:
      - target: JarvisWatchWidgets
        embed: true
    entitlements:
      path: Watch/JarvisCompanionWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bshventures.jarvis.companion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.watchkitapp
      INFOPLIST_FILE: Watch/Info.plist
      GENERATE_INFOPLIST_FILE: false
      WATCHOS_DEPLOYMENT_TARGET: "26.0"
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.bshventures.jarvis.companion
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: JARVIS talks to Jarvis on your Mac over your network.

  # Home Screen and Lock Screen widgets (and the Live Activities' views).
  JarvisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Activity
      - path: WidgetsCommon
      - path: Widgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.widgets
      INFOPLIST_FILE: Widgets/Info.plist
      GENERATE_INFOPLIST_FILE: false
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      TARGETED_DEVICE_FAMILY: "1"
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: J.A.R.V.I.S.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/JarvisWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bshventures.jarvis.companion

  # "Send to Jarvis" in the share sheet.
  JarvisShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ShareKit
      - path: Share
      - path: iOS/Views/Components.swift
      - path: iOS/Views/SpaceBackground.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.share
      INFOPLIST_FILE: Share/Info.plist
      GENERATE_INFOPLIST_FILE: false
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      TARGETED_DEVICE_FAMILY: "1"
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: J.A.R.V.I.S.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: Share/JarvisShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bshventures.jarvis.companion

  # Watch complications.
  JarvisWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: WidgetsCommon
      - path: WatchWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.watchkitapp.widgets
      INFOPLIST_FILE: WatchWidgets/Info.plist
      GENERATE_INFOPLIST_FILE: false
      WATCHOS_DEPLOYMENT_TARGET: "26.0"
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/JarvisWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bshventures.jarvis.companion

  JarvisCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JarvisCompanion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.tests
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      GENERATE_INFOPLIST_FILE: true

  # Runs only against a test server (see README); skips itself otherwise.
  JarvisCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: JarvisCompanion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bshventures.jarvis.companion.uitests
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      GENERATE_INFOPLIST_FILE: true

schemes:
  JarvisCompanion:
    build:
      targets:
        JarvisCompanion: all
        JarvisCompanionTests: [test]
        JarvisCompanionUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Jarvis.storekit
    test:
      config: Debug
      targets:
        - JarvisCompanionTests
        - JarvisCompanionUITests
  JarvisCompanionWatch:
    build:
      targets:
        JarvisCompanionWatch: all
    run:
      config: Debug
